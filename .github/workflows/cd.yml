name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create application-dev.yml
        run: |
          cat > src/main/resources/application-dev.yml << 'EOF'
          ${{ secrets.APPLICATION_DEV_YML }}
          EOF

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload JAR to S3 staging
        id: upload
        run: |
          JAR_PATH=$(ls build/libs/*.jar | grep -v plain)
          S3_KEY="pocketpay-batch/${{ github.sha }}/app.jar"
          aws s3 cp "$JAR_PATH" "s3://${{ vars.DEPLOY_ARTIFACT_BUCKET }}/$S3_KEY"
          echo "s3_key=$S3_KEY" >> "$GITHUB_OUTPUT"

      # docker cp는 목적지 디렉터리가 이미 있어야 한다(없는 상위 경로를 알아서 안 만들어줌).
      # 컨테이너 안 jenkins 유저는 /opt 밑에 쓰기 권한이 없고 컨테이너엔 sudo도 없어서,
      # 호스트에서 docker exec -u root로 먼저 만들어준다(호스트 docker 데몬은 컨테이너 안
      # 유저 권한과 무관하게 root로 exec 가능).
      - name: Deploy via SSM Run Command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PocketPay_Batch ${{ github.sha }}" \
            --parameters commands="[
              \"set -e\",
              \"aws s3 cp s3://${{ vars.DEPLOY_ARTIFACT_BUCKET }}/${{ steps.upload.outputs.s3_key }} /tmp/pocketpay-batch.jar\",
              \"docker exec -u root ${{ vars.JENKINS_CONTAINER_NAME }} mkdir -p $(dirname ${{ vars.BATCH_JAR_PATH_IN_CONTAINER }})\",
              \"docker cp /tmp/pocketpay-batch.jar ${{ vars.JENKINS_CONTAINER_NAME }}:${{ vars.BATCH_JAR_PATH_IN_CONTAINER }}\",
              \"docker exec -u root ${{ vars.JENKINS_CONTAINER_NAME }} chmod -R a+rX $(dirname ${{ vars.BATCH_JAR_PATH_IN_CONTAINER }})\",
              \"rm -f /tmp/pocketpay-batch.jar\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

      - name: Show SSM command error output (on failure)
        if: failure() && steps.ssm.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text
