spring:
  main:
    web-application-type: none

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  datasource:
    business:
      jdbc-url: jdbc:h2:mem:business;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
    batch:
      jdbc-url: jdbc:h2:mem:batch;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

mock-pg:
  base-url: http://localhost:0

payment-events:
  channel: payment:status-changed

payment-completion:
  point-earn-rate: 0.05

settlement:
  pg-fee-rate: 0.029
  platform-fee-rate: 0.05
